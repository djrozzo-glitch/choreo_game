<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#e9e3d9"><title>EVERYBODY DANCES — Ragdoll Puppet</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e3d9;font-family:Arial,Helvetica,sans-serif;color:#181818;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}#brand{font-weight:950;letter-spacing:-1.7px;font-size:clamp(23px,5vw,39px);line-height:.88}#sub{font-size:10px;letter-spacing:2px;margin-top:9px;font-weight:700}#timer{font-weight:900;font-size:36px;font-variant-numeric:tabular-nums}#bottom{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px}#hint{font-size:12px;font-weight:700;letter-spacing:1.3px;text-align:center;text-transform:uppercase}button{background:#191919;color:#fff;border:0;border-radius:99px;padding:15px 24px;font-weight:900;letter-spacing:1px;cursor:pointer;font-size:13px}button.secondary{background:#fff;color:#191919;border:2px solid #191919}#buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}#overlay{position:absolute;inset:0;background:rgba(233,227,217,.97);display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;gap:16px}#overlay.show{display:flex}#overlay h1{font-size:clamp(32px,9vw,64px);line-height:.95;letter-spacing:-2px;max-width:650px;margin:0}#overlay p{font-size:12px;letter-spacing:2px;font-weight:800;margin:0}#overlay .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}#overlay small{max-width:380px;line-height:1.5}#countdown{position:absolute;inset:0;display:none;place-items:center;font-size:30vw;font-weight:900;pointer-events:none}#countdown.show{display:grid}#modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}#modes button{padding:9px 12px;font-size:10px;background:#fff;color:#191919;border:2px solid #191919}#modes button.active{background:#ef5345;color:#fff}#bottom{gap:8px}#overlay .actions button{font-size:11px}#top{z-index:2}@media(max-width:500px){#top{padding:17px 14px}#timer{font-size:30px}button{padding:14px 18px}}</style></head><body><canvas id="scene"></canvas><div id="top"><div><div id="brand">EVERYBODY<br>DANCES<span style="color:#f14b3e">.</span></div><div id="sub">RAGDOLL PUPPET / EXPERIMENT 001</div></div><div id="timer">60</div></div><div id="bottom"><div id="hint">DRAG THE DOTS. MAKE ART. OR A MESS.</div><div id="modes"><button data-move="gravity" class="active">GRAVITY</button><button data-move="float">FLOAT</button><button data-move="pulse">PULSE</button></div><div id="buttons"><button id="start">START PERFORMANCE</button><button class="secondary" id="reset">RESET POSE</button></div></div><div id="countdown"></div><div id="overlay"><p>YOUR CONTEMPORARY MASTERPIECE</p><h1 id="workTitle"></h1><p id="stats"></p><div class="actions"><button id="replay">WATCH PERFORMANCE</button><button id="poster" class="secondary">SAVE POSTER</button><button id="share" class="secondary">SHARE</button><button id="again" class="secondary">DANCE AGAIN</button></div><small>Share your poster. Your choreography is a one-of-a-kind accident.</small></div><script>
(()=>{'use strict';const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),timer=document.getElementById('timer'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay'),countdown=document.getElementById('countdown');let W=0,H=0,dpr=1,scale=1,ground=0,points=[],sticks=[],drag=null,mode='idle',remaining=60,elapsed=0,last=performance.now(),frames=[],playIndex=0,energy=0,grabs=0,workTitle='',currentPose=null,starting=false,movement='gravity',recordClock=0,playClock=0,recordSamples=[],lastSample=0,activePointer=null,peakEnergy=0;const bones=[[0,1],[1,2],[2,3],[1,4],[4,5],[5,6],[1,7],[7,8],[8,9],[1,10],[10,11],[11,12],[7,10]];const specs=[['head',0,-148,13],['neck',0,-112,7],['lShoulder',-24,-104,7],['lHand',-75,-60,10],['rShoulder',24,-104,7],['rElbow',49,-79,7],['rHand',75,-60,10],['lHip',-17,-35,7],['lKnee',-24,24,8],['lFoot',-32,85,10],['rHip',17,-35,7],['rKnee',24,24,8],['rFoot',32,85,10]]; // left shoulder to hand is intentionally a single flexible segment
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.min(W/380,H/660,1.6);ground=H*.79;if(!points.length)resetPose();}function resetPose(){const cx=W/2,cy=ground-90*scale;points=specs.map(([name,x,y,r])=>({name,x:cx+x*scale,y:cy+y*scale,oldx:cx+x*scale,oldy:cy+y*scale,r:r*scale}));sticks=bones.map(([a,b])=>({a,b,len:Math.hypot(points[a].x-points[b].x,points[a].y-points[b].y)}));drag=null;}function physics(dt){let f=Math.min(dt/16.67,2);for(let p of points){if(drag===p)continue;let vx=(p.x-p.oldx)*.987,vy=(p.y-p.oldy)*.987;p.oldx=p.x;p.oldy=p.y;p.x+=vx*f;p.y+=vy*f+(movement==='float'?.065:movement==='pulse'?.19:.34)*scale*f*f;if(movement==='pulse'&&mode==='record'){p.x+=Math.sin(elapsed/240+p.y*.02)*.24*scale*f;p.y+=Math.cos(elapsed/310+p.x*.01)*.18*scale*f}}for(let j=0;j<8;j++){for(let s of sticks){let a=points[s.a],b=points[s.b],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1,diff=(dist-s.len)/dist*.48;if(a!==drag){a.x+=dx*diff;a.y+=dy*diff}if(b!==drag){b.x-=dx*diff;b.y-=dy*diff}}for(let p of points){if(p.y>ground-p.r){p.y=ground-p.r;p.oldx=p.x-(p.x-p.oldx)*.72;p.oldy=p.y+(p.y-p.oldy)*.12}p.x=Math.max(p.r+8,Math.min(W-p.r-8,p.x));p.y=Math.max(45,Math.min(H-45,p.y))}}if(drag){drag.x=pointer.x;drag.y=pointer.y;drag.oldx=drag.x;drag.oldy=drag.y}}
let pointer={x:0,y:0};function position(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{if(mode==='play')return;pointer=position(e);let best=null,dist=55*scale+10;for(let p of points){let d=Math.hypot(pointer.x-p.x,pointer.y-p.y);if(d<dist){best=p;dist=d}}if(best){drag=best;activePointer=e.pointerId;grabs++;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{pointer=position(e);if(drag&&e.pointerId===activePointer){energy+=Math.hypot(pointer.x-drag.x,pointer.y-drag.y)/Math.max(scale,0.5);drag.x=pointer.x;drag.y=pointer.y}});function release(e){if(e&&activePointer!==null&&e.pointerId!==activePointer)return;drag=null;activePointer=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle=movement==='float'?'#e5e5f0':movement==='pulse'?'#f2ddd8':'#e9e3d9';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ef5345';ctx.fillRect(0,ground+12,W,H-ground-12);ctx.fillStyle='#1a1a1a';ctx.fillRect(0,ground+10,W,2);ctx.strokeStyle='rgba(25,25,25,.13)';ctx.lineWidth=1;for(let i=0;i<9;i++){let x=W*i/8;ctx.beginPath();ctx.moveTo(x,ground+12);ctx.lineTo(W/2+(x-W/2)*1.8,H);ctx.stroke()}ctx.fillStyle='rgba(25,25,25,.1)';ctx.beginPath();ctx.ellipse(W/2,ground+7,95*scale,10*scale,0,0,Math.PI*2);ctx.fill();ctx.lineCap='round';ctx.lineJoin='round';for(let [a,b] of bones){const p=points[a],q=points[b];ctx.strokeStyle='#1b1b1b';ctx.lineWidth=([1,7,10].includes(a)?13:9)*scale;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}let head=points[0];ctx.fillStyle='#1b1b1b';ctx.beginPath();ctx.ellipse(head.x,head.y,18*scale,22*scale,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e9e3d9';ctx.beginPath();ctx.arc(head.x+6*scale,head.y-2*scale,2.5*scale,0,Math.PI*2);ctx.fill();if(mode!=='play')for(let p of points){if(!['head','lHand','rHand','lFoot','rFoot','lHip','rHip'].includes(p.name))continue;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(6,p.r*.8),0,Math.PI*2);ctx.fillStyle=p===drag?'#fff':'#f14b3e';ctx.fill();ctx.strokeStyle='#1b1b1b';ctx.lineWidth=2;ctx.stroke()}ctx.save();ctx.translate(18,ground-16);ctx.rotate(-Math.PI/2);ctx.fillStyle='#171717';ctx.font='bold 10px Arial';ctx.letterSpacing='2px';ctx.fillText('MOVE / FEEL / REPEAT',0,0);ctx.restore()}
function snapshot(){return points.map(p=>[Math.round(p.x/W*10000)/10000,Math.round(p.y/H*10000)/10000])}function applyFrame(frame){if(!frame)return;frame.forEach((v,i)=>{points[i].x=v[0]*W;points[i].y=v[1]*H})}function finish(){mode='result';drag=null;activePointer=null;remaining=0;timer.textContent='00';const names=['A VERY AGGRESSIVE TUESDAY','MY THERAPIST WOULD HATE THIS','AN UNNECESSARY AMOUNT OF FEELINGS','THE COLLAPSE OF PERSONAL BOUNDARIES','SOMEONE PLEASE CALL THE CHOREOGRAPHER','THE ART OF ALMOST FALLING','THREE EMOTIONS AND NO PLAN','A BEAUTIFUL ACCIDENT'];workTitle=names[Math.abs(Math.floor(energy/140+grabs*3))%names.length];document.getElementById('workTitle').textContent=workTitle;document.getElementById('stats').textContent=`${grabs} GESTURES · ${Math.round(energy)} MOVEMENT ENERGY`;overlay.classList.add('show');document.getElementById('start').textContent='START PERFORMANCE'}function start(){if(starting)return;starting=true;overlay.classList.remove('show');resetPose();frames=[];recordSamples=[];lastSample=0;energy=0;grabs=0;elapsed=0;playClock=0;remaining=60;timer.textContent='60';mode='idle';let n=3;countdown.classList.add('show');countdown.textContent=n;const id=setInterval(()=>{n--;if(n){countdown.textContent=n}else{clearInterval(id);countdown.classList.remove('show');mode='record';hint.textContent='YOUR STAGE. YOUR RULES. 60 SECONDS.';starting=false}},700)}function replay(){overlay.classList.remove('show');mode='play';playIndex=0;playClock=0;last=performance.now();hint.textContent='YOUR WORLD PREMIERE';document.getElementById('start').textContent='RESTART'}document.getElementById('start').onclick=()=>{if(mode==='record'){finish()}else start()};document.getElementById('reset').onclick=()=>{if(mode!=='play')resetPose()};document.getElementById('again').onclick=start;document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{movement=b.dataset.move;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('active',x===b));hint.textContent=movement==='gravity'?'DRAG THE DOTS. MAKE ART. OR A MESS.':movement==='float'?'FLOAT MODE — MAKE IT WEIGHTLESS':'PULSE MODE — THE STAGE IS ALIVE'});document.getElementById('replay').onclick=replay;
async function share(){const text=workTitle+' — my choreography in EVERYBODY DANCES';if(navigator.share){try{await navigator.share({title:'EVERYBODY DANCES',text,url:location.protocol.startsWith('http')?location.href:undefined});return}catch(e){if(e.name==='AbortError')return}}if(navigator.clipboard){try{await navigator.clipboard.writeText(text+' '+location.href);alert('Share text copied!');return}catch(e){}}alert(text)}document.getElementById('share').onclick=share;function poster(){let c=document.createElement('canvas');c.width=1080;c.height=1350;let x=c.getContext('2d');x.fillStyle='#e9e3d9';x.fillRect(0,0,1080,1350);x.fillStyle='#ef5345';x.fillRect(0,1020,1080,330);x.fillStyle='#171717';x.font='900 110px Arial';x.fillText('EVERYBODY',55,135);x.fillText('DANCES.',55,240);x.font='bold 24px Arial';x.fillText('YOUR CONTEMPORARY MASTERPIECE',60,300);let f=frames[Math.floor(frames.length*.7)]||snapshot();x.save();x.translate(0,80);x.strokeStyle='#171717';x.lineCap='round';x.lineWidth=22;for(let [a,b] of bones){x.beginPath();x.moveTo(f[a][0]*1080,f[a][1]*850+150);x.lineTo(f[b][0]*1080,f[b][1]*850+150);x.stroke()}x.fillStyle='#171717';x.beginPath();x.arc(f[0][0]*1080,f[0][1]*850+150,32,0,Math.PI*2);x.fill();x.restore();x.fillStyle='#171717';x.font='900 55px Arial';let words=workTitle.split(' '),line='',yy=1110;for(let w of words){let t=line?line+' '+w:w;if(x.measureText(t).width>960){x.fillText(line,55,yy);yy+=63;line=w}else line=t}x.fillText(line,55,yy);x.font='bold 23px Arial';x.fillText('CHOREOGRAPHY BY YOU  /  EXPERIMENT 001',55,1310);c.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='everybody-dances-poster.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')};document.getElementById('poster').onclick=poster;
function loop(now){let dt=Math.min(now-last,50);last=now;if(mode==='play'){playClock+=dt;while(playIndex<recordSamples.length-1&&recordSamples[playIndex+1].t<=playClock)playIndex++;if(recordSamples.length&&playClock<=recordSamples[recordSamples.length-1].t+100){applyFrame(recordSamples[Math.min(playIndex,recordSamples.length-1)].pose);timer.textContent=String(Math.max(0,Math.ceil((60000-playClock)/1000))).padStart(2,'0')}else finish()}else{physics(dt);if(mode==='record'){elapsed+=dt;remaining=Math.max(0,60-elapsed/1000);timer.textContent=String(Math.ceil(remaining)).padStart(2,'0');if(elapsed-lastSample>=33){const pose=snapshot();frames.push(pose);recordSamples.push({t:elapsed,pose});lastSample=elapsed}if(remaining<=0)finish()}}draw();requestAnimationFrame(loop)}addEventListener('resize',resize);resize();requestAnimationFrame(loop)})();
</script></body></html>
