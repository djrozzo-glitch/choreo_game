function frame(t){const dt=Math.min(50,t-last);last=t;if(ready){if(mode==='play'&&posePlaying){poseElapsed=audioPlaybackActive&&!danceAudio.paused?danceAudio.currentTime*1000:poseElapsed+dt;const poseStepMs=poseStep();const beat=Math.floor(poseElapsed*BPM/60000);if(beat!==lastBeat){lastBeat=beat;$('beatDot').style.opacity=beat%4===0?'1':'.65'}else $('beatDot').style.opacity='.25';const segment=Math.min(poseKeys.length-2,Math.floor(poseElapsed/poseStepMs));const fraction=THREE.MathUtils.clamp((poseElapsed-segment*poseStepMs)/poseStepMs,0,1);const eased=fraction*fraction*(3-2*fraction);blendRecordedPose(poseKeys[segment].pose,poseKeys[segment+1].pose,eased);$('timer').textContent=String(Math.ceil(Math.max(0,(poseKeys.length-1)*poseStepMs-poseElapsed)/1000)).padStart(2,'0');if(poseElapsed>=(poseKeys.length-1)*poseStepMs){stopDanceAudio();posePlaying=false;mode='idle';$('posePlay').textContent='PLAY CHOREOGRAPHY';restore(poseKeys.at(-1).pose)}}$('timelineFill').style.width=(mode==='play'?Math.min(100,poseElapsed/Math.max((poseKeys.length-1)*poseStep(),1)*100):mode==='result'?'100':'0')+'%';updateHandles();ring.material.opacity=.4+Math.sin(t*.002)*.18;rim.intensity=45}renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
