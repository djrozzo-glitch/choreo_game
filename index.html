</style></head><body><div id="ui"><div id="header"><div><div id="brand">EVERYBODY<br>DANCES<span style="color:#fa3e36">.</span></div><div id="sub">3D PUPPET / EXPERIMENT 003</div></div><div id="timer">60</div></div><div id="status"><span id="loading">LOADING DANCER…</span></div><div id="side"><button id="left">↶ VIEW</button><button id="right">VIEW ↷</button><button id="front">FRONT</button></div><div id="bottom"><div id="hint">DRAG THE RED JOINTS TO CHOREOGRAPH</div><div id="modes"><button class="active" data-mode="gravity">GRAVITY</button><button data-mode="float">FLOAT</button><button data-mode="pulse">PULSE</button></div><div id="actions"><button class="primary" id="start">START PERFORMANCE</button><button id="reset">RESET POSE</button></div></div><div id="overlay"><p>YOUR CONTEMPORARY MASTERPIECE</p><h1 id="workTitle"></h1><p id="stats"></p><div class="buttons"><button class="primary" id="replay">WATCH PERFORMANCE</button><button id="poster">SAVE POSTER</button><button id="share">SHARE</button><button id="again">DANCE AGAIN</button></div><small>One body. Infinite questionable decisions. Share your accidental choreography.</small></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script type="module">

const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color('#111114');scene.fog=new THREE.Fog('#111114',8,16);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.05,50);let azimuth=0;const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.65;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8e3ff,0x5e3636,2.2));const key=new THREE.SpotLight(0xffeee9,110,14,Math.PI/5,.6,1.2);key.position.set(-2.5,5,3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key,key.target);const rim=new THREE.PointLight(0xff3135,45,9);rim.position.set(2,3,-2);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x262127,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const ring=new THREE.Mesh(new THREE.RingGeometry(1.65,1.69,96),new THREE.MeshBasicMaterial({color:0xf33c3c,side:THREE.DoubleSide,transparent:true,opacity:.65}));ring.rotation.x=-Math.PI/2;ring.position.y=.012;scene.add(ring);
let dancer=null,bones={},base={},handles=[],drag=null,mode='idle',movement='gravity',record=[],duration=60000,elapsed=0,playTime=0,last=performance.now(),lastSample=-100,grabs=0,energy=0,title='',ready=false,modelScale=1,hips=null,restHips=null,initialPose={};const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tempV=new THREE.Vector3(),worldV=new THREE.Vector3(),tmpQ=new THREE.Quaternion();const names=['A VERY AGGRESSIVE TUESDAY','MY THERAPIST WOULD HATE THIS','THE COLLAPSE OF PERSONAL BOUNDARIES','AN UNNECESSARY AMOUNT OF FEELINGS','THE ART OF ALMOST FALLING','PLEASE DO NOT CALL THIS BALLET','AN ACCIDENTAL MASTERPIECE','MY BODY HAS OTHER PLANS'];
function view(){const dist=innerWidth<650?6.8:5.8;camera.position.set(Math.sin(azimuth)*dist,2.1,Math.cos(azimuth)*dist);camera.lookAt(0,1.1,0)}view();function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<650?48:35;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);view()}addEventListener('resize',resize);
const jointNames=['Head','LeftHand','RightHand','LeftForeArm','RightForeArm','LeftLeg','RightLeg','LeftFoot','RightFoot','Hips'];const chains={LeftHand:['LeftHand','LeftForeArm','LeftArm'],RightHand:['RightHand','RightForeArm','RightArm'],LeftForeArm:['LeftForeArm','LeftArm'],RightForeArm:['RightForeArm','RightArm'],LeftFoot:['LeftFoot','LeftLeg','LeftUpLeg'],RightFoot:['RightFoot','RightLeg','RightUpLeg'],LeftLeg:['LeftLeg','LeftUpLeg'],RightLeg:['RightLeg','RightUpLeg'],Head:['Head','Neck','Spine2','Spine1'],Hips:['Hips']};
function bone(n){const normalize=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'').replace(/^mixamorig/,'').replace(/^armature/,'');return Object.entries(bones).find(([name])=>normalize(name)===normalize(n))?.[1]||null};function capture(){const a=[];for(const b of Object.values(bones))a.push(b.quaternion.toArray());return {q:a,h:hips.position.toArray()}}function restore(p){if(!p)return;let i=0;for(const b of Object.values(bones))b.quaternion.fromArray(p.q[i++]);hips.position.fromArray(p.h);dancer.updateMatrixWorld(true)}
function reset(){if(!ready)return;restore(initialPose);drag=null;updateHandles()}
function updateHandles(){if(!ready)return;dancer.updateMatrixWorld(true);for(const h of handles){h.bone.getWorldPosition(h.mesh.position);h.mesh.visible=mode!=='play'&&mode!=='result'}}
const initialBoneRotations={};function solveIK(chain,target,iterations=7){for(let iter=0;iter<iterations;iter++){for(let j=1;j<chain.length;j++){const joint=bone(chain[j]),end=bone(chain[0]);if(!joint||!end)continue;dancer.updateMatrixWorld(true);const pivot=joint.getWorldPosition(new THREE.Vector3()),tip=end.getWorldPosition(new THREE.Vector3());const toTip=tip.sub(pivot).normalize(),toTarget=target.clone().sub(pivot).normalize();if(toTip.lengthSq()<.01||toTarget.lengthSq()<.01)continue;const q=new THREE.Quaternion().setFromUnitVectors(toTip,toTarget);const angle=2*Math.acos(THREE.MathUtils.clamp(q.w,-1,1));if(angle>.45){q.setFromAxisAngle(new THREE.Vector3(q.x,q.y,q.z).normalize(),.45)}const parentWorld=joint.parent.getWorldQuaternion(new THREE.Quaternion());const localQ=parentWorld.clone().invert().multiply(q).multiply(parentWorld);joint.quaternion.premultiply(localQ);const rest=initialBoneRotations[joint.name];if(rest){const offset=rest.clone().invert().multiply(joint.quaternion);const normalized=joint.name.toLowerCase();const maxAngle=normalized.includes('spine')?.12:normalized.includes('shoulder')?.18:normalized.includes('arm')?.85:1.35;const angle=2*Math.acos(THREE.MathUtils.clamp(Math.abs(offset.w),0,1));if(angle>maxAngle){offset.normalize();rest.clone().slerp(joint.quaternion,maxAngle/angle);joint.quaternion.copy(rest.clone().slerp(joint.quaternion,maxAngle/angle))}}}}}
function load(){new GLTFLoader().load('./assets/dancer.glb',g=>{dancer=g.scene;scene.add(dancer);dancer.traverse(o=>{if(o.isBone)bones[o.name]=o;if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});hips=bone('Hips');if(!hips){const names=Object.keys(bones);console.error('Dancer skeleton bones:',names);$('loading').textContent='HIP BONE NOT FOUND: '+(names.slice(0,5).join(', ')||'NO BONES');return}dancer.updateMatrixWorld(true);const bbox=new THREE.Box3().setFromObject(dancer),sz=bbox.getSize(new THREE.Vector3()),ctr=bbox.getCenter(new THREE.Vector3());modelScale=1.95/Math.max(sz.y,.01);dancer.scale.setScalar(modelScale);dancer.position.set(-ctr.x*modelScale,-bbox.min.y*modelScale,-ctr.z*modelScale);dancer.updateMatrixWorld(true);for(const n of jointNames){const b=bone(n);if(!b)continue;const mesh=new THREE.Mesh(new THREE.SphereGeometry(n==='Hips'?.105:(['LeftLeg','RightLeg','LeftForeArm','RightForeArm'].includes(n)?.082:.075),14,12),new THREE.MeshBasicMaterial({color:0xfa3e36,transparent:true,opacity:.85,depthTest:false}));mesh.renderOrder=10;scene.add(mesh);handles.push({name:n,bone:b,mesh})}console.info('Detected bones:',Object.keys(bones));console.info('Interactive handles:',handles.map(h=>h.name));for(const [name,b] of Object.entries(bones))initialBoneRotations[name]=b.quaternion.clone();initialPose=capture();ready=true;mode='idle';$('status').style.display='none';reset();},undefined,e=>{$('loading').textContent='COULD NOT LOAD MODEL. RUN FROM A LOCAL SERVER OR GITHUB PAGES.';console.error(e)})}load();
function coords(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera)}
renderer.domElement.addEventListener('pointerdown',e=>{if(!ready||mode==='play'||mode==='result')return;coords(e);const hit=ray.intersectObjects(handles.map(h=>h.mesh),false)[0];if(!hit)return;const h=handles.find(h=>h.mesh===hit.object);const normal=camera.getWorldDirection(new THREE.Vector3());const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(normal,h.mesh.position);drag={h,plane,target:h.mesh.position.clone(),pointer:e.pointerId,hipStart:h.mesh.position.clone()};grabs++;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;coords(e);const target=new THREE.Vector3();if(ray.ray.intersectPlane(drag.plane,target)){energy+=target.distanceTo(drag.target)*20;drag.target.copy(target);if(drag.h.name==='Hips'){const pos=hips.getWorldPosition(new THREE.Vector3());const delta=target.clone().sub(pos);const gesture=target.clone().sub(drag.hipStart);const dx=gesture.x,dy=gesture.y;const rest=initialBoneRotations[hips.name];const twist=new THREE.Quaternion().setFromEuler(new THREE.Euler(THREE.MathUtils.clamp(-dy*.65,-.35,.35),0,THREE.MathUtils.clamp(dx*.65,-.4,.4),'XYZ'));hips.quaternion.copy(rest).multiply(twist);}else solveIK(chains[drag.h.name],target);updateHandles()}});function release(e){if(drag&&e.pointerId===drag.pointer)drag=null}renderer.domElement.addEventListener('pointerup',release);renderer.domElement.addEventListener('pointercancel',release);
function start(){if(!ready)return;reset();record=[];elapsed=0;playTime=0;lastSample=-100;grabs=0;energy=0;mode='record';$('overlay').classList.remove('show');$('hint').textContent='DRAG JOINTS — YOUR 60 SECONDS START NOW';$('start').textContent='END PERFORMANCE';$('timer').textContent='60'}function finish(){if(!ready)return;mode='result';drag=null;title=names[Math.floor(energy/7+grabs*3)%names.length];$('workTitle').textContent=title;$('stats').textContent=`${grabs} GESTURES · ${Math.round(energy)} MOVEMENT ENERGY`;$('overlay').classList.add('show');$('start').textContent='START PERFORMANCE';$('timer').textContent='00';updateHandles()}

function frame(t){const dt=Math.min(50,t-last);last=t;if(ready){if(mode==='record'){elapsed+=dt;if(movement==='pulse'&&!drag){const b=bone('Spine2');if(b)b.rotation.z+=Math.sin(t*.009)*.0007}if(movement==='float'&&!drag){hips.position.y+=Math.sin(t*.002)*.0005}if(elapsed-lastSample>=50){record.push({t:elapsed,pose:capture()});lastSample=elapsed}$('timer').textContent=String(Math.ceil(Math.max(0,duration-elapsed)/1000)).padStart(2,'0');if(elapsed>=duration)finish()}else if(mode==='play'){playTime+=dt;let i=0;while(i<record.length-1&&record[i+1].t<playTime)i++;if(record[i])restore(record[i].pose);$('timer').textContent=String(Math.ceil(Math.max(0,duration-playTime)/1000)).padStart(2,'0');if(playTime>(record.at(-1)?.t||0)+100)finish()}updateHandles();ring.material.opacity=.4+Math.sin(t*.002)*.18;rim.intensity=movement==='pulse'?45+Math.sin(t*.009)*15:45}renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
