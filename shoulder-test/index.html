<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EVERYBODY DANCES — Shoulder QA</title><style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#f7f1ed;font:14px Arial}#bar{position:fixed;z-index:2;top:0;left:0;right:0;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#17171bdc}button{background:#2c2b31;border:1px solid #777;color:white;padding:11px;border-radius:20px}button.active{background:#f2483c}#status{font-size:12px;color:#ddd}canvas{display:block;touch-action:none}#footer{position:fixed;bottom:12px;left:12px;right:12px;text-align:center;color:#ddd;pointer-events:none;font-size:12px}</style></head><body><div id="bar"><b>SHOULDER QA</b><button id="new" class="active">NEW · CHEER</button><button id="old">OLD · REST</button><button id="play">PAUSE</button><button id="reset">RESET CAMERA</button><span id="status">Loading…</span></div><div id="footer">Drag to orbit · Pinch to zoom · Compare armpits when arms are raised</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#111114');
scene.add(new THREE.HemisphereLight(0xffffff,0x5b454a,2.4));const light=new THREE.DirectionalLight(0xffeee9,3.5);light.position.set(3,6,5);scene.add(light);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
let models={},current='new',playing=true,az=0,el=.12,dist=4.7,drag=null,pinch=0;const points=new Map();const status=document.getElementById('status');function view(){camera.position.set(Math.sin(az)*Math.cos(el)*dist,1+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,1,0)}view();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
async function load(which,url){const gltf=await new GLTFLoader().loadAsync(url);const root=gltf.scene;scene.add(root);root.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const scale=2/size.y;root.scale.setScalar(scale);root.position.set(-center.x*scale,-box.min.y*scale,-center.z*scale);const mixer=new THREE.AnimationMixer(root);if(gltf.animations.length){mixer.clipAction(gltf.animations[0]).play()}models[which]={root,mixer,clip:gltf.animations[0]?.name||'None'};root.visible=which===current;status.textContent=which==='new'?'New animation: '+models.new.clip:'Ready';}
function choose(which){current=which;for(const [key,m] of Object.entries(models))m.root.visible=key===which;document.querySelectorAll('#new,#old').forEach(b=>b.classList.toggle('active',b.id===which));status.textContent=models[which]?(which==='old'?'Old model in rest pose':'New animation: '+models[which].clip):'Loading…'}
document.getElementById('new').onclick=()=>choose('new');document.getElementById('old').onclick=()=>choose('old');document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'PAUSE':'PLAY'};document.getElementById('reset').onclick=()=>{az=0;el=.12;dist=4.7;view()};
const c=renderer.domElement;c.addEventListener('pointerdown',e=>{points.set(e.pointerId,{x:e.clientX,y:e.clientY});c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};if(points.size===2){const p=[...points.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});c.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===2){const p=[...points.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)dist=THREE.MathUtils.clamp(dist*pinch/d,2.4,9);pinch=d}else if(drag){az-=(e.clientX-drag.x)*.007;el=THREE.MathUtils.clamp(el+(e.clientY-drag.y)*.005,-.5,1.1);drag={x:e.clientX,y:e.clientY}}view()});function end(e){points.delete(e.pointerId);if(points.size<2)pinch=0;drag=null}c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('wheel',e=>{e.preventDefault();dist=THREE.MathUtils.clamp(dist+e.deltaY*.005,2.4,9);view()},{passive:false});
Promise.allSettled([load('new','./new_cheer.glb'),load('old','./old_running.glb')]).then(results=>{const bad=results.filter(r=>r.status==='rejected');if(bad.length){status.textContent='Load failed — use a web server';console.error(bad)}else choose('new')});
const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);if(playing&&models.new)models.new.mixer.update(dt);renderer.render(scene,camera)}tick();
</script></body></html>
